    <h2>什么是力？</h2>
	<br>
<p>什么是力？</p>
<p>对黄天琪的脸施加压力，</p>
<p>他的脸出现一个坑，</p>
<p>那么，问施力物体和受力物体是什么？</p>
<p>昨天，怼黄天琪的脸，</p>
<p>他的脸发生弹性形变</p>
<p>停止对黄天琪的脸施加压力，</p>
<p>他的脸的坑也随之消失，</p>
<p>说明受力停止，物体恢复，</p>
<p>要是没恢复，</p>
<p>他爸他妈该找我来了。</p>
<br>
<p>现在，扯黄天琪的衣服，</p>
<p>他的衣服发生形变，</p>
<p>停止扯黄天琪的衣服，</p>
<p>他的衣服恢复原来的形状，</p>
<p>说明衣服发生弹性形变</p>
<br>
