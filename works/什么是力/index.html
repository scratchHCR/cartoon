<div class=WordSection1 style='layout-grid:15.6pt'>

<p class=MsoNormal><b><span style='font-size:22.0pt;line-height:115%'>什么是力？</span></b></p>

<p class=MsoNormal><span lang=EN-US style='font-size:16.0pt;line-height:115%'>&nbsp;</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>什么是力？</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>对黄天琪的脸施加压力，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>他的脸出现一个坑，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>那么，问施力物体和受力物体是什么？</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>昨天，怼黄天琪的脸，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>他的脸发生弹性形变</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>停止对黄天琪的脸施加压力，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>他的脸的坑也随之消失，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>说明受力停止，物体恢复，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>要是没恢复，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>他爸他妈该找我来了。</span></p>

<p class=MsoNormal><span lang=EN-US style='font-size:16.0pt;line-height:115%'>&nbsp;</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>现在，扯黄天琪的衣服，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>他的衣服发生形变，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>停止扯黄天琪的衣服，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>他的衣服恢复原来的形状，</span></p>

<p class=MsoNormal><span style='font-size:16.0pt;line-height:115%'>说明衣服发生弹性形变</span></p>

</div>
